<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كوفتا">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>معادلة كوفتا — كوفتا العبور</title>
<style>
  
  :root{
    --primary:#6366F1; --primary-dark:#4F46E5; --primary-light:#E0E7FF;
    --success:#10B981; --success-dark:#059669; --success-light:#D1FAE5;
    --danger:#F43F5E; --danger-dark:#E11D48; --danger-light:#FFE4E6;
    --warning:#F59E0B; --warning-dark:#D97706; --warning-light:#FEF3C7;
    --info:#06B6D4; --info-dark:#0891B2; --info-light:#CFFAFE;
    --violet:#8B5CF6; --violet-dark:#7C3AED; --violet-light:#EDE9FE;
    --rose:#FB7185; --rose-dark:#E11D48;
    --text:#111827; --text-light:#6B7280; --text-muted:#9CA3AF;
    --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --border-light:#F1F5F9;
    --shadow:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -2px rgba(0,0,0,0.04);
    --shadow-sm:0 4px 6px -1px rgba(0,0,0,0.06),0 2px 4px -1px rgba(0,0,0,0.03);
    --radius:16px; --radius-sm:10px; --radius-xs:6px;
    --kpi-bg: linear-gradient(135deg, #EEF2FF 0%, #FFFFFF 100%);
  }

  body.dark-mode {
    --text:#F3F4F6; --text-light:#9CA3AF; --text-muted:#6B7280;
    --bg:#0B0F19; --card:#161E2E; --border:#2E384D; --border-light:#1F2937;
    --primary-light:#1E1B4B; --success-light:#064E3B; --danger-light:#4C0519;
    --warning-light:#451A03; --info-light:#083344; --violet-light:#2E1065;
    --shadow:0 10px 25px -3px rgba(0,0,0,0.5);
    --shadow-sm:0 4px 10px -1px rgba(0,0,0,0.35);
    --kpi-bg: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
  }

  body {
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  body.dark-mode {
    background: linear-gradient(135deg, #0B0F19 0%, #111827 50%, #064E3B 100%) !important;
  }

  /* KPI Summary Cards */
  .kpi-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .kpi-card {
    background: var(--kpi-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 5px;
  }
  .kpi-card.blue::after { background: var(--primary); }
  .kpi-card.green::after { background: var(--success); }
  .kpi-card.red::after { background: var(--danger); }
  .kpi-card.amber::after { background: var(--warning); }
  .kpi-title { font-size: 13px; color: var(--text-light); font-weight: 700; }
  .kpi-val { font-size: 22px; font-weight: 900; color: var(--text); }

  /* Filter / Search Bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--card);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    margin-bottom: 14px;
  }
  .search-input {
    flex: 1;
    min-width: 200px;
    background: var(--bg) !important;
    color: var(--text) !important;
    border: 1.5px solid var(--border) !important;
    padding: 9px 12px !important;
    border-radius: var(--radius-xs) !important;
    font-size: 14px !important;
    text-align: right !important;
  }
  .search-input:focus {
    border-color: var(--primary) !important;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.25) !important;
  }
  .filter-btn-group {
    display: flex;
    gap: 6px;
  }
  .filter-btn {
    padding: 7px 14px;
    font-size: 12px;
    border-radius: 20px;
    background: var(--bg);
    color: var(--text-light);
    border: 1px solid var(--border);
    cursor: pointer;
    font-weight: 700;
  }
  .filter-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  :root{
    --primary:#6366F1; --primary-dark:#4F46E5; --primary-light:#E0E7FF;
    --success:#10B981; --success-dark:#059669; --success-light:#D1FAE5;
    --danger:#F43F5E; --danger-dark:#E11D48; --danger-light:#FFE4E6;
    --warning:#F59E0B; --warning-dark:#D97706; --warning-light:#FEF3C7;
    --info:#06B6D4; --info-dark:#0891B2; --info-light:#CFFAFE;
    --violet:#8B5CF6; --violet-dark:#7C3AED; --violet-light:#EDE9FE;
    --rose:#FB7185; --rose-dark:#E11D48;
    --text:#111827; --text-light:#6B7280; --text-muted:#9CA3AF;
    --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --border-light:#F1F5F9;
    --shadow:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -2px rgba(0,0,0,0.04);
    --shadow-sm:0 4px 6px -1px rgba(0,0,0,0.06),0 2px 4px -1px rgba(0,0,0,0.03);
    --radius:16px; --radius-sm:10px; --radius-xs:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#F8FAFC 0%,#EEF2FF 50%,#F0FDFA 100%);color:var(--text);font-family:"Segoe UI","Tahoma",system-ui,-apple-system,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom));font-size:16.5px;line-height:1.6;}

  /* Header - Vibrant Indigo */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#2563EB 100%);box-shadow:0 8px 32px rgba(79,70,229,0.35);padding:10px 14px 10px;color:#fff;}
  h1{display:none;}
  .status{display:none;}
  .header-actions{display:flex;justify-content:center;gap:8px;margin-bottom:0;flex-wrap:wrap;}
  .online-toggle{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.18);backdrop-filter:blur(12px);
    border:1.5px solid rgba(255,255,255,0.35);border-radius:28px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;transition:all 0.25s;
  }
  .online-toggle:hover{background:rgba(255,255,255,0.3);transform:translateY(-1px);}
  .online-toggle.on{background:linear-gradient(135deg,var(--success),var(--success-dark));border-color:transparent;box-shadow:0 4px 12px rgba(16,185,129,0.4);}
  .online-toggle.off{background:linear-gradient(135deg,var(--danger),var(--danger-dark));border-color:transparent;box-shadow:0 4px 12px rgba(244,63,94,0.4);}
  .save-all-btn{
    background:#fff;color:var(--primary-dark);border:none;border-radius:28px;padding:9px 20px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.12);transition:all 0.25s;
  }
  .save-all-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.18);filter:brightness(1.05);}
  .save-all-btn:active{transform:translateY(0);}

  /* Bottom Navigation - Native App Style */
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;overflow-x:auto;gap:8px;
    background:rgba(255,255,255,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--border);box-shadow:0 -8px 28px rgba(31,41,55,0.12);
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:58px;padding:4px 2px;border-radius:14px;background:transparent;color:var(--text-muted);
    font-size:9.5px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:all 0.2s;}
  .tab .tab-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    font-size:19px;line-height:1;border-radius:11px;background:linear-gradient(135deg,#EEF2FF,#F5F3FF);
    box-shadow:0 2px 6px rgba(31,41,55,0.08);transition:transform 0.2s;}
  .tab:active .tab-icon{transform:scale(0.87);}
  .tab:hover .tab-icon{background:var(--primary-light);}
  .tab.active{color:var(--primary-dark);font-weight:800;}
  .tab.active .tab-icon{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--primary), 0 6px 16px rgba(99,102,241,0.35);transform:scale(1.08);}

  /* Page transition */
  @keyframes viewIn{from{opacity:0;transform:translateX(-18px) scale(.98);}to{opacity:1;transform:translateX(0) scale(1);}}
  #main.view-enter{animation:viewIn 0.35s cubic-bezier(.22,.61,.36,1) both;}

  main{max-width:1450px;margin:0 auto;padding:14px 6px;}

  /* Cards - Glassmorphism */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:all 0.3s;}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .card h2{margin:0 0 16px;font-size:20px;color:var(--primary-dark);font-weight:800;border-right:5px solid var(--primary);padding-right:14px;letter-spacing:-0.3px;}

  /* Tables - Modern */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;}
  th,td{padding:14px 11px;text-align:center;border-bottom:1.5px solid var(--border-light);white-space:nowrap;}
  th{background:linear-gradient(180deg,#F8FAFC,#EEF2FF);color:var(--text);font-size:13.5px;font-weight:800;position:sticky;top:0;z-index:2;border-bottom:3px solid var(--primary);text-transform:uppercase;letter-spacing:0.8px;padding:16px 11px;}
  td.name{text-align:right;padding-right:14px;color:#111827;font-weight:800;position:sticky;right:0;background:var(--card);z-index:1;min-width:130px;font-size:16.5px;}
  tr:nth-child(even) td{background:#FAFBFF;}
  tr:nth-child(even) td.name{background:#FAFBFF;}
  tr:hover td{background:linear-gradient(90deg,var(--primary-light),#F0FDFA);transition:all 0.15s;}
  tr:hover td.name{background:linear-gradient(90deg,var(--primary-light),#F0FDFA);}
  .tablewrap{overflow:auto;max-height:65vh;border:1.5px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 2px 8px rgba(0,0,0,0.04);}

  /* إلغاء الأسهم - إدخال يدوي كامل */
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0;display:none;}

  /* Inputs - Modern */
  input[type=number],input[type=text]{width:72px;background:linear-gradient(135deg,#1F1F1F,#0A0A0A) !important;color:#FFD700 !important;border:2px solid #B8860B;
    border-radius:var(--radius-xs);padding:9px 6px;text-align:center;font-size:15.5px;font-weight:700;transition:all 0.2s;}
  input[type=number]:focus,input[type=text]:focus{outline:none;border-color:#FFD700;box-shadow:0 0 0 4px rgba(255,215,0,0.35);background:#000 !important;color:#FFD700 !important;}
  input.wide{width:170px;text-align:right;padding-right:10px;}
  input.tiny{width:62px;}

  /* Buttons - Vibrant */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  button{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:var(--radius-xs);
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(99,102,241,0.35);transition:all 0.25s;}
  button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.45);filter:brightness(1.08);}
  button:active{transform:translateY(0) scale(0.96);}
  button.secondary{background:#fff;border:2px solid var(--border);color:var(--text);box-shadow:var(--shadow-sm);}
  button.secondary:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);box-shadow:0 4px 12px rgba(99,102,241,0.15);}
  button.danger{background:linear-gradient(135deg,var(--danger),var(--danger-dark));color:#fff;padding:7px 14px;font-size:12.5px;border-radius:var(--radius-xs);box-shadow:0 4px 12px rgba(244,63,94,0.3);}
  button.danger:hover{box-shadow:0 6px 16px rgba(244,63,94,0.4);}

  /* Pills - Vibrant */
  .pill{background:linear-gradient(135deg,var(--primary-light),#E0E7FF);border:1.5px solid #C7D2FE;border-radius:24px;padding:8px 16px;font-size:13.5px;color:var(--primary-dark);display:inline-block;margin:4px;font-weight:700;box-shadow:0 2px 6px rgba(99,102,241,0.1);}
  .pill b{color:var(--primary-dark);font-weight:800;}

  /* Status Colors - Light, consistent tints with colored accent + dark readable text.
     Semantic rule (unified across the whole app): عجز/سالب = أحمر فاتح، زيادة/موجب = أخضر فاتح. */
  .cell-red{background:var(--danger-light);color:var(--danger-dark);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid rgba(225,29,72,0.25);border-inline-start:4px solid var(--danger-dark);font-size:15.5px;}
  .cell-orange{background:var(--warning-light);color:var(--warning-dark);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid rgba(217,119,6,0.25);border-inline-start:4px solid var(--warning-dark);font-size:15.5px;}
  .cell-green{background:var(--success-light);color:var(--success-dark);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid rgba(5,150,105,0.25);border-inline-start:4px solid var(--success-dark);font-size:15.5px;}
  .cell-violet{background:var(--violet-light);color:var(--violet-dark);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid rgba(124,58,237,0.25);border-inline-start:4px solid var(--violet-dark);font-size:15.5px;}
  .cell-cyan{background:var(--info-light);color:var(--info-dark);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid rgba(8,145,178,0.25);border-inline-start:4px solid var(--info-dark);font-size:15.5px;}
  .ag-col{background:var(--primary-light);color:var(--primary-dark);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid rgba(79,70,229,0.2);border-inline-start:4px solid var(--primary-dark);font-size:15.5px;}
  .cell-neutral{background:var(--border-light);color:var(--text-light);font-weight:800;border-radius:12px;padding:8px 13px;border:1.5px solid var(--border);border-inline-start:4px solid var(--text-muted);font-size:15.5px;}

  /* Analysis bar-chart - light, consistent with cell colors */
  .chart-wrap{display:flex;flex-direction:column;gap:10px;}
  .chart-row{display:grid;grid-template-columns:96px 1fr 72px;align-items:center;gap:10px;}
  .chart-label{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chart-track{background:var(--border-light);border-radius:10px;height:16px;overflow:hidden;position:relative;border:1px solid var(--border);}
  .chart-bar-red{height:100%;background:linear-gradient(90deg,var(--danger-light),var(--danger));border-radius:10px;}
  .chart-bar-green{height:100%;background:linear-gradient(90deg,var(--success-light),var(--success));border-radius:10px;}
  .chart-bar-neutral{height:100%;background:var(--text-muted);border-radius:10px;opacity:.4;}
  .chart-value{font-size:13px;font-weight:800;text-align:left;}
  .txt-red{color:var(--danger-dark);}
  .txt-green{color:var(--success-dark);}
  .txt-neutral{color:var(--text-light);}

  /* Toast - Vibrant */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(24px);background:linear-gradient(135deg,var(--success),var(--success-dark));color:#fff;
    padding:14px 32px;border-radius:32px;font-weight:800;font-size:16px;opacity:0;pointer-events:none;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);z-index:60;box-shadow:0 12px 32px rgba(16,185,129,0.4);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Notes */
  .note{font-size:13px;color:var(--text-light);margin-top:12px;line-height:1.8;background:linear-gradient(135deg,var(--primary-light),#F0FDFA);padding:14px 18px;border-radius:var(--radius-sm);border-right:4px solid var(--primary);font-weight:500;}

  /* Grid */
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}

  /* Pick Button */
  .pick-btn{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;border:none;border-radius:var(--radius);
    padding:28px 18px;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(99,102,241,0.35);transition:all 0.3s;}
  .pick-btn:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(99,102,241,0.45);filter:brightness(1.08);}
  .pick-btn:active{transform:translateY(-1px);}
  .pick-btn-title{font-size:20px;font-weight:900;}
  .pick-btn-sub{font-size:13px;font-weight:600;opacity:.9;}

  input[type=file]{display:none;}
  .drop{border:2.5px dashed var(--primary);border-radius:var(--radius-sm);padding:18px;text-align:center;margin-top:14px;font-size:14px;color:var(--primary);cursor:pointer;background:linear-gradient(135deg,var(--primary-light),#F0FDFA);transition:all 0.25s;font-weight:600;}
  .drop:hover{background:#DBEAFE;border-style:solid;transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,0.15);}

  /* Scrollbar - Graphic */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);border-radius:5px;}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),var(--violet));border-radius:5px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--primary-dark),var(--violet-dark));}

  /* Login Gate */
  .login-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#2563EB 100%);padding:20px;}
  .login-box{background:#fff;border-radius:var(--radius);padding:36px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-box .emoji{font-size:40px;margin-bottom:6px;}
  .login-box h2{margin:0 0 6px;font-size:19px;font-weight:900;color:var(--primary-dark);}
  .login-box p{margin:0 0 18px;font-size:13px;color:var(--text-light);}
  .login-box input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:2px solid var(--border-light);text-align:center;font-weight:700;letter-spacing:2px;}
  .login-box input[type=password]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light);}
  .login-box button{width:100%;margin-top:14px;padding:12px;font-size:14.5px;}
  .login-box .login-error{color:var(--danger-dark);font-size:12.5px;font-weight:700;margin-top:10px;min-height:16px;}

  /* Professional visual refinement */
  :root{
    --primary:#1D4ED8; --primary-dark:#1E3A8A; --primary-light:#DBEAFE;
    --success:#15803D; --success-dark:#166534; --success-light:#DCFCE7;
    --danger:#B91C1C; --danger-dark:#991B1B; --danger-light:#FEE2E2;
    --warning:#B45309; --warning-dark:#92400E; --warning-light:#FEF3C7;
    --info:#0369A1; --info-dark:#075985; --info-light:#E0F2FE;
    --violet:#6D28D9; --violet-dark:#5B21B6; --violet-light:#EDE9FE;
    --text:#172033; --text-light:#475569; --text-muted:#64748B;
    --bg:#F1F5F9; --card:#FFFFFF; --border:#CBD5E1; --border-light:#E2E8F0;
    --shadow:0 14px 30px rgba(15,23,42,.10),0 4px 10px rgba(15,23,42,.05);
    --shadow-sm:0 5px 14px rgba(15,23,42,.07);
    --radius:18px; --radius-sm:12px; --radius-xs:9px;
  }
  body{background:linear-gradient(135deg,#F8FAFC 0%,#EFF6FF 52%,#F0FDFA 100%);font-size:18px;line-height:1.75;}
  header{background:linear-gradient(135deg,#1E3A8A 0%,#1D4ED8 55%,#0369A1 100%);padding:14px 18px;box-shadow:0 8px 28px rgba(30,58,138,.25);}
  .header-actions{gap:10px;}
  .online-toggle,.save-all-btn{min-height:46px;padding:10px 18px;font-size:15px;}
  .save-all-btn{color:var(--primary-dark);}
  main{max-width:1500px;padding:24px 18px;}
  .card{padding:22px 20px;margin-bottom:20px;border-color:#D5DEE9;}

function emptyDays(){ return new Array(31).fill(0); }
function initSupply(){
  const supply = {};
  for(const sheet of Object.keys(SHEET_DEFS)){
    supply[sheet] = {};
    for(const def of SHEET_DEFS[sheet]) supply[sheet][def.label] = emptyDays();
  }
  return supply;
}
function defaultState(){
  const s = {
    raw: JSON.parse(JSON.stringify(DEFAULT_RAW)),
    supply: initSupply(),
    analysis: {},
    customFields: {}, // لأي صنف مضاف يدويًا: {name:{c,d,e,f,g}}
    coreItems: [...CORE_ITEMS], // قابلة للتعديل: إضافة/حذف أصناف
    itemCodes: {}, // كود يدوي لكل صنف: {name: 'code'}
    rayebInv: {rayebKham:0, rayebMasnoo:0, serbToot:0, serbKiwi:0},
    ayesh: [],
    siyana: [],
    cons: defaultCons(),
  };
  s.coreItems.forEach(c => { s.analysis[c] = {b:0, h:0}; s.itemCodes[c] = ''; });
  for(let i=1;i<=31;i++) s.ayesh.push({day:i, c:0,d:0,e:0,f:0,g:0,h:0});
  return s;
}

/* ============================================================
   دمج الحالة (Deep Merge) — بيضمن ماتضيعش بيانات nested
   ============================================================ */
function mergeState(loaded){

  // توافقية وترقية تلقائية للمسميات القديمة
  if(loaded.supply){
    if(loaded.supply['محول له'] && !loaded.supply['تحويل داخلي']) loaded.supply['تحويل داخلي'] = loaded.supply['محول له'];
    if(loaded.supply['محول منه'] && !loaded.supply['تحويل خارجي']) loaded.supply['تحويل خارجي'] = loaded.supply['محول منه'];
  }

  const def = defaultState();
  function deepMerge(target, source){
    if(source === null || source === undefined) return target;
    if(typeof source !== 'object') return source;
    if(Array.isArray(source)) return source.slice();
    const result = {};
    const keys = new Set([...Object.keys(target || {}), ...Object.keys(source || {})]);
    for(const key of keys){
      if(source.hasOwnProperty(key)){
        if(typeof source[key] === 'object' && source[key] !== null && !Array.isArray(source[key]) &&
           typeof target[key] === 'object' && target[key] !== null && !Array.isArray(target[key])){
          result[key] = deepMerge(target[key], source[key]);
        } else {
          result[key] = source[key];
        }
      } else {
        result[key] = target[key];
      }
    }
    return result;
  }
  state = deepMerge(def, loaded);
}

async function loadState(){
  if(isOnlineMode){
    try{
      const snap = await getDoc(STATE_DOC);
      remoteOK = true; // قراءة Firebase نجحت: آمن نكتب عليه
      if(snap.exists()){
        const loaded = JSON.parse(snap.data().data);
        mergeState(loaded);
        cacheLocally();
        document.getElementById('status').textContent = 'تم تحميل آخر نسخة من Firebase ☁️';
        return;
      }
    }catch(e){
      console.error(e);
      document.getElementById('status').textContent = '⚠️ تعذر الاتصال بـ Firebase - جاري التحميل من النسخة المحلية';
    }
  }
  // أوفلاين أو فشل الاتصال: حمّل من النسخة المحلية المخزنة
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      mergeState(JSON.parse(raw));
      document.getElementById('status').textContent = 'نسخة محلية' + (isOnlineMode ? '' : ' (وضع أوفلاين)');
      return;
    }
  }catch(e){ console.error(e); }
  document.getElementById('status').textContent = 'نسخة جديدة (لسه مفيش حفظ سابق)';
}

async function toggleOnline(){

  }else{
    showToast('📴 وضع أوفلاين - هيحفظ محليًا بس');
  }
}

}

function fmt(n){

}

/* ============================================================
   محرك الحسابات (مطابق لمعادلات الإكسيل الأصلية)
   ============================================================ */
function computeMaterials(){
  const totals = {};
  for(const item of state.raw){
    const recipe = RECIPES[item.code];
    if(!recipe) continue;
    for(const [material,factor] of Object.entries(recipe.factors)){
      totals[material] = (totals[material]||0) + (Number(item.qty)||0)*factor;
    }
  }
  return totals;
}
function computeSupplyAG(sheet, label){
  const def = SHEET_DEFS[sheet].find(d=>d.label===label);
  const days = state.supply[sheet][label];
  const sum = days.reduce((s,v)=>s+(Number(v)||0), 0);
  return sum * def.factor;
}
function computeCoreFromSheet(sheet, core){
  let total = 0;
  for(const def of SHEET_DEFS[sheet]) if(def.core===core) total += computeSupplyAG(sheet, def.label);
  return total;
}
function computeRayebInventoryParts(){
  const r = state.rayebInv;
  const D21 = 0.95 * (Number(r.rayebKham)||0);   // رايب خام
  const D22 = 0.18 * (Number(r.rayebMasnoo)||0); // رايب مصنع
  const D23 = 4.45 * (Number(r.serbToot)||0);    // سيرب توت
  const D24 = 4.2  * (Number(r.serbKiwi)||0);    // سيرب كيوي
  return {D21, D22, D23, D24, D25: D21 + D22 + D23 + D24};
}
function computeRayebInventoryTotal(){ return computeRayebInventoryParts().D25; } // H12 = D25
function computeAnalysis(){
  const materials = computeMaterials();
  const rows = [];
  let eKofta=0, eHawawshi=0;
  for(const core of state.coreItems){
    const manual = state.analysis[core] || {b:0,h:0};
    const isStandard = SHEET_STANDARD_ITEMS.has(core);
    const cf = state.customFields[core] || {};
    const code = (state.itemCodes[core]||'').trim();
    const rawMatch = code ? state.raw.find(r=>String(r.code).trim()===code) : null;
    const linkedByCode = !!rawMatch;

    const c = isStandard ? computeCoreFromSheet('الاستلامات', core) : (Number(cf.c)||0);
    const d = isStandard ? computeCoreFromSheet('تحويل داخلي', core) : (Number(cf.d)||0);
    const f = isStandard ? computeCoreFromSheet('تحويل خارجي', core) : (Number(cf.f)||0);
    const g = isStandard ? computeCoreFromSheet('اعدامات', core) : (Number(cf.g)||0);
    let e;
    if(core==='فحم') e = null; // يُحسب لاحقًا برسبي الفحم
    else if(isStandard) e = materials[MATERIAL_MAP[core]] || 0;
    else if(linkedByCode) e = Number(rawMatch.qty)||0; // مرتبط بكود من شيت الخام تلقائيًا
    else e = Number(cf.e)||0; // صنف مخصص بدون كود: مباع يدوي

    if(core==='كفته') eKofta = e;
    if(core==='حواوشي') eHawawshi = e;
    let h = Number(manual.h)||0;
    if(core === 'رايب') h = computeRayebInventoryTotal();
    rows.push({name: core, b: Number(manual.b)||0, c, d, e, f, g, h, isStandard, linkedByCode});
  }
  const fahmRow = rows.find(r=>r.name==='فحم');
  if(fahmRow) fahmRow.e = 84 * (((eKofta/80) + (eHawawshi/400)) / 2);
  for(const r of rows){
    r.i = ((r.b + r.c + r.d) - (r.e + r.f + r.g + r.h)) * -1;
    r.j = r.e !== 0 ? r.i / r.e : 0;
    r.k = r.e !== 0 ? r.g / r.e : 0;
    r.l = r.j - r.k;
    r.aa = r.b + r.c - r.h;
    r.ab = r.aa - r.e;
  }
  return rows;
}
function computeWagabatIstaf(){
  const kofta = Number((state.raw.find(r=>r.code==='5429')||{qty:0}).qty)||0;
  const hawawshi = Number((state.raw.find(r=>r.code==='5430')||{qty:0}).qty)||0;
  const total = kofta+hawawshi;
  return {kofta, hawawshi, total, meals: total/2};
}

/* ============================================================
   استيراد HTM (تحليل مطابق لتقرير الكاشير)
   ============================================================ */
function parseItemSales(text){
  const re = /<div style="position:absolute;top:(\d+)px;left:(\d+)px;[^"]*">\r?\n([\s\S]*?)\r?\n<\/DIV>/gi;
  const rowsByTop = new Map();
  let m;
  while((m = re.exec(text)) !== null){
    const top = parseInt(m[1],10), left = parseInt(m[2],10);
    let content = m[3].replace(/&nbsp;/g,' ').replace(/<[^>]+>/g,'').trim();
    if(!rowsByTop.has(top)) rowsByTop.set(top, []);
    rowsByTop.get(top).push([left, content]);
  }
  const tops = [...rowsByTop.keys()].sort((a,b)=>a-b);
  const items = [];
  for(const top of tops){
    const cells = rowsByTop.get(top).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    if(cells.length>=3 && /^\d{3,}$/.test(cells[0])){
      const qty = parseFloat(cells[2].replace(/,/g,''));
      if(!isNaN(qty)) items.push({code:cells[0], name:cells[1], qty});
    }
  }
  const merged = new Map();
  for(const it of items){
    if(merged.has(it.code)) merged.get(it.code).qty += it.qty;
    else merged.set(it.code, {...it});
  }
  return [...merged.values()];
}
async function handleHtmFile(file){
  try{
    const buf = await file.arrayBuffer();
    let text;
    try{ text = new TextDecoder('windows-1256').decode(buf); }
    catch(e){ text = new TextDecoder('utf-8').decode(buf); }
    const rows = parseItemSales(text);
    if(rows.length===0){ showToast('⚠️ مفيش بيانات في الملف ده'); return; }
    // استبدال شيت الخام بالكامل بالبيانات الجديدة (تقرير مجمّع)
    for(const r of rows){
      const existing = state.raw.find(x=>x.code===r.code);
      if(existing){ existing.qty = r.qty; existing.name = r.name; }
      else state.raw.push({code:r.code, name:r.name, qty:r.qty});
    }
    showToast(`✓ تم استيراد ${rows.length} صنف تلقائيًا`);
    renderAll();
  }catch(err){
    showToast('⚠️ خطأ: '+err.message);
  }
}
document.getElementById('fileInput').addEventListener('change', e=>{
  if(e.target.files.length) handleHtmFile(e.target.files[0]);
});

function goToTab(direction){
  const idx = TABS.findIndex(t=>t.id===activeTab);
  const nextIdx = idx + direction;
  if(nextIdx < 0 || nextIdx >= TABS.length) return;
  activeTab = TABS[nextIdx].id;
  renderAll();
  window.scrollTo({top:0, left:0, behavior:'instant'});
}

(function setupSwipeNavigation(){
  let startX = 0, startY = 0, startedInTable = false;
  const main = document.getElementById('main');
  main.addEventListener('touchstart', (e)=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startedInTable = !!e.target.closest('.tablewrap');
  }, {passive:true});
  main.addEventListener('touchend', (e)=>{
    if(startedInTable) return; // don't hijack horizontal table scrolling
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // must be a clear horizontal swipe
    goToTab(dx < 0 ? 1 : -1);
  }, {passive:true});
})();

function renderTabs(){

}

function downloadBlob(blob, filename){

  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function cleanTableForExport(table){
  const clone = table.cloneNode(true);
  // حذف عمود الإجراءات (الذي عنوانه "—")
  const headRow = clone.querySelector('tr');
  if(headRow){
    const idx = [...headRow.children].findIndex(c => c.textContent.trim() === '—');
    if(idx !== -1) clone.querySelectorAll('tr').forEach(tr => { if(tr.children[idx]) tr.children[idx].remove(); });
  }
  clone.querySelectorAll('button').forEach(b => b.remove());
  clone.querySelectorAll('input').forEach(inp => {
    inp.replaceWith(document.createTextNode(inp.value));
  });
  clone.querySelectorAll('[onclick],[onchange],[oninput]').forEach(el => {
    el.removeAttribute('onclick'); el.removeAttribute('onchange'); el.removeAttribute('oninput');
  });
  return clone.outerHTML;
}

/* ---------- محرك استهلاك المستلزمات ---------- */
function consQty(code){
  const it = state.raw.find(r=>String(r.code).trim()===String(code));
  return it ? (Number(it.qty)||0) : 0;
}
function consNameOf(code){
  if(code==='SINGLES') return 'ساندوتشات فردية (تقديري)';
  const it = state.raw.find(r=>String(r.code).trim()===String(code));
  if(it && it.name) return it.name;
  return (RECIPES[code] && RECIPES[code].name) || '';
}
function consEffMap(item){
  const m = Object.assign({}, item.map||{});
  if(state.cons.includeStaff){
    if(m['5401']!==undefined && m['5429']===undefined) m['5429'] = m['5401']; // كفتة اسطاف = ساندوتش كفتة عادي
    if(m['5402']!==undefined && m['5430']===undefined) m['5430'] = m['5402']; // حواوشي اسطاف = ساندوتش حواوشي عادي
  }
  return m;
}
function computeCons(){
  const cons = state.cons;
  const sandCodes = ['5401','5402','5403','5404','5405','5406','5407','5408'].concat(cons.includeStaff ? ['5429','5430'] : []);
  const sandTotal = sandCodes.reduce((s,c)=>s+consQty(c),0);
  const boxed = Object.entries(cons.boxCap||{}).reduce((s,[c,cap])=>s+consQty(c)*(Number(cap)||0),0);
  const singles = Math.max(0, sandTotal - boxed);
  const out = {};
  for(const item of cons.items){
    let total = 0; const parts = [];
    for(const [code,f] of Object.entries(consEffMap(item))){
      const q = code==='SINGLES' ? singles : consQty(code);
      const c = q*(Number(f)||0);
      total += c;
      parts.push({code, name:consNameOf(code), qty:q, factor:f, contrib:c});
    }
    out[item.id] = {total, parts};
  }
  return {out, singles, sandTotal, boxed};
}
function consMapText(m){ return Object.entries(m||{}).map(([c,f])=>c+':'+Number((Number(f)||0).toPrecision(6))).join(', '); }
function consParseMap(t){
  const m = {};
  const parts = String(t||'').split(/[,،;\n]+/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){
    const mm = p.match(/^([A-Za-z0-9_]+)\s*[:=]\s*([0-9]*\.?[0-9]+(?:[eE]-?\d+)?)$/);
    if(!mm) return null;
    m[mm[1]] = parseFloat(mm[2]);
  }
  return m;
}
function consSetStaff(v){ state.cons.includeStaff = !!v; scheduleAutoSave(); renderAll(); }
function consSaveMap(id, text){
  const m = consParseMap(text);
  if(m===null){ showToast('⚠️ الصيغة غلط — اكتب: كود:معامل ، كود:معامل (مثال 5401:1, 5403:1)'); renderAll(); return; }
  const it = state.cons.items.find(x=>x.id===id); if(!it) return;
  it.map = m; scheduleAutoSave(); renderAll(); showToast('✅ اتحدّث المعامل');
}
function consSaveBoxCap(text){
  const m = consParseMap(text);
  if(m===null){ showToast('⚠️ الصيغة غلط — مثال: 1803:4, 1804:8'); renderAll(); return; }
  state.cons.boxCap = m; scheduleAutoSave(); renderAll(); showToast('✅ اتحدّثت سعات البوكسات');
}

  }

  html += `<div class="card"><h2>⚠️ أصناف مبيعات مش داخلة في أي بند</h2>

/* ---------- تحليل المبيعات (عرض مجمّع مشتق) ---------- */
function renderTahleelMabee3at(){
  const materials = computeMaterials();
  const groups = {};
  for(const [code,r] of Object.entries(RECIPES)){
    const item = state.raw.find(x=>x.code===code);
    const qty = item ? Number(item.qty)||0 : 0;
    for(const [material,factor] of Object.entries(r.factors)){
      if(!groups[material]) groups[material] = [];
      groups[material].push({code, name:r.name, qty, contribution: qty*factor});
    }
  }
  let html = '<div class="card"><h2>تحليل المبيعات (مجمّع حسب الصنف الأساسي)</h2>';
  for(const [material, items] of Object.entries(groups)){
    const total = materials[material]||0;
    html += `<div style="margin-bottom:14px;">
      <div class="pill" style="font-size:13px;">${material}: <b>${fmt(total)}</b></div>
      <div class="tablewrap" style="margin-top:6px;max-height:220px;">
        <table><thead><tr><th>الكود</th><th>الصنف</th><th>الكمية</th><th>المساهمة</th></tr></thead>
        <tbody>${items.map(it=>`<tr><td>${it.code}</td><td class="name" style="position:static;">${it.name}</td><td>${fmt(it.qty)}</td><td>${fmt(it.contribution)}</td></tr>`).join('')}</tbody></table>
      </div></div>`;
  }
  html += '</div>';
  return html;
}

function updateRaw(idx, field, value){ state.raw[idx][field] = field==='qty' ? (parseFloat(value)||0) : value; renderAll(); }
function addRawRow(){ state.raw.push({code:'',name:'',qty:0}); renderAll(); }
function deleteRawRow(idx){ state.raw.splice(idx,1); renderAll(); }
function pasteRaw(){
  navigator.clipboard.readText().then(text=>{
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    let added=0;
    for(const line of lines){
      const parts = line.split('\t');
      if(parts.length>=3){
        const code=parts[0].trim(), name=parts[1].trim(), qty=parseFloat(parts[2].replace(/,/g,''));
        if(code && !isNaN(qty)){
          const ex = state.raw.find(r=>r.code===code);
          if(ex){ ex.qty=qty; } else state.raw.push({code,name,qty});
          added++;
        }
      }
    }
    showToast(`تم استيراد ${added} صف`);
    renderAll();
  }).catch(()=>showToast('⚠️ اسمح للمتصفح بالوصول للحافظة'));
}

function updateCustomField(name, field, value){

function updateItemCode(name, value){

function addCoreItem(){
  const name = prompt('اسم الصنف الجديد:');
  if(!name) return;
  const trimmed = name.trim();

  if(state.coreItems.includes(trimmed)){ showToast('⚠️ الصنف ده موجود بالفعل'); return; }

function removeCoreItem(name){

  delete state.analysis[name];
  delete state.customFields[name];

  renderAll();
  showToast('تم حذف "'+name+'"');
}

/* ---------- تنبيهات العجز والزيادة ---------- */
const ALERT_THR_KEY = 'kofta-alert-threshold';   // نسبة % (الافتراضي 2)
const ALERT_ON_KEY  = 'kofta-alert-notify';      // إشعارات الجهاز شغالة؟
const ALERT_SIG_KEY = 'kofta-alert-sig';         // آخر حالة تنبيهات اتبلّغ عنها
let alertTimer = null;
function alertThreshold(){ const v = parseFloat(localStorage.getItem(ALERT_THR_KEY)); return isNaN(v) ? 2 : v; }
function computeAlerts(){
  const thr = alertThreshold() / 100;
  return computeAnalysis().filter(r=>{
    if(Math.abs(r.i) < 0.005) return false;           // متوازن
    if(!r.e) return true;                              // فيه فرق ومفيش مباع
    return Math.abs(r.j) >= thr;                       // فوق النسبة المحددة
  }).map(r=>({name:r.name, type: r.i<0 ? 'عجز' : 'زيادة', value:r.i, pct: r.e ? r.j : null}));
}
async function pushDeviceNotification(title, body){
  if(localStorage.getItem(ALERT_ON_KEY) !== 'true') return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = {body, icon:'./icon-192.png', badge:'./icon-192.png', tag:'kofta-alert', renotify:true, dir:'rtl', lang:'ar'};
  try{
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if(reg){ await reg.showNotification(title, opts); return; }
  }catch(e){ console.error(e); }
  try{ new Notification(title, opts); }catch(e){ console.error(e); }
}
function scheduleAlertCheck(){
  if(!appReady) return;
  clearTimeout(alertTimer);
  alertTimer = setTimeout(doAlertCheck, 3000); // استنى لحد ما تخلّص كتابة
}
function doAlertCheck(){
  const alerts = computeAlerts();
  const sig = {}; alerts.forEach(a=>{ sig[a.name] = a.type + ':' + (Math.round(a.value*100)/100); });
  let prev = null;
  try{ prev = JSON.parse(localStorage.getItem(ALERT_SIG_KEY)); }catch(e){}
  localStorage.setItem(ALERT_SIG_KEY, JSON.stringify(sig));
  if(prev === null) return;                                  // أول تشغيل: بس نسجّل الحالة
  const fresh = alerts.filter(a=>prev[a.name] !== sig[a.name]);
  if(!fresh.length) return;
  const line = a => (a.type==='عجز' ? '🔴 عجز ' : '🟢 زيادة ') + a.name + ': ' + fmt(a.value);
  const body = fresh.slice(0,5).map(line).join('\n') + (fresh.length>5 ? '\n+' + (fresh.length-5) + ' أصناف تانية' : '');
  showToast('🔔 ' + fresh.length + ' تنبيه جديد (عجز/زيادة)');
  pushDeviceNotification('🔔 تنبيه مخزون كوفتا', body);
}
async function toggleDeviceNotifications(){
  if(!('Notification' in window)){ showToast('المتصفح ده مش بيدعم الإشعارات'); return; }
  if(localStorage.getItem(ALERT_ON_KEY) === 'true'){
    localStorage.setItem(ALERT_ON_KEY, 'false'); showToast('🔕 اتقفلت إشعارات الجهاز'); renderAll(); return;
  }
  const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  if(perm === 'granted'){

}
function setAlertThreshold(v){

}

/* ---------- الأرشيف (حفظ الشهور السابقة + استرجاع شهر كامل أو يوم معين) ---------- */
const ARC_LOCAL_KEY = 'kofta-archive-v1';
let arcIndex = [];      // [{key,label,savedAt}]
let arcPreview = null;  // {key, day, rows}
function arcStamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
function arcLocalLoad(){ try{ return JSON.parse(localStorage.getItem(ARC_LOCAL_KEY)||'{}'); }catch(e){ return {}; } }
function arcLocalSave(o){ try{ localStorage.setItem(ARC_LOCAL_KEY, JSON.stringify(o)); return true; }catch(e){ console.error(e); return false; } }
function arcMonthName(key){
  const m = /^(\d{4})-(\d{2})$/.exec(key);
  if(!m) return key;
  return new Date(+m[1], +m[2]-1, 1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
}
async function arcSave(key, label, snapshot){
  const savedAt = Date.now();
  const o = arcLocalLoad(); o[key] = {label, savedAt, data: snapshot};
  const localOk = arcLocalSave(o);
  let remoteOk = false;
  if(isOnlineMode){
    try{
      await setDoc(doc(db,'kofta-app','archive-'+key), {data: JSON.stringify(snapshot), label, savedAt});
      const idxRef = doc(db,'kofta-app','archive-index');
      const idxSnap = await getDoc(idxRef);
      let items = idxSnap.exists() ? JSON.parse(idxSnap.data().items) : [];
      items = items.filter(i=>i.key!==key); items.push({key,label,savedAt});
      await setDoc(idxRef, {items: JSON.stringify(items)});
      remoteOk = true;
    }catch(e){ console.error(e); }
  }
  return {localOk, remoteOk};
}
async function arcRefresh(){
  const map = new Map();
  const o = arcLocalLoad();
  for(const [key,v] of Object.entries(o)) map.set(key,{key,label:v.label,savedAt:v.savedAt});
  if(isOnlineMode){
    try{
      const snap = await getDoc(doc(db,'kofta-app','archive-index'));
      if(snap.exists()) for(const i of JSON.parse(snap.data().items)) if(!map.has(i.key) || (map.get(i.key).savedAt||0) < (i.savedAt||0)) map.set(i.key,i);
    }catch(e){ console.error(e); }
  }
  const isMonth = k=>/^\d{4}-\d{2}$/.test(k);
  arcIndex = [...map.values()].sort((a,b)=>{
    if(isMonth(a.key)&&isMonth(b.key)) return b.key.localeCompare(a.key);
    if(isMonth(a.key)) return -1; if(isMonth(b.key)) return 1;
    return (b.savedAt||0)-(a.savedAt||0);
  });
  if(activeTab==='الأرشيف') renderAll();
}
async function arcGetData(key){
  const o = arcLocalLoad();
  if(o[key] && o[key].data) return o[key].data;
  if(isOnlineMode){
    try{
      const snap = await getDoc(doc(db,'kofta-app','archive-'+key));
      if(snap.exists()) return JSON.parse(snap.data().data);
    }catch(e){ console.error(e); }
  }
  return null;
}
async function archiveCurrentMonth(){
  const el = document.getElementById('arcMonth');
  const key = el && el.value;
  if(!/^\d{4}-\d{2}$/.test(key||'')){ showToast('اختار الشهر الأول'); return; }
  if(arcIndex.some(i=>i.key===key) && !confirm('الشهر ده محفوظ قبل كده في الأرشيف. تستبدله بالبيانات الحالية؟')) return;
  const r = await arcSave(key, arcMonthName(key), JSON.parse(JSON.stringify(state)));
  if(r.remoteOk) showToast('🗄️ اتحفظ في الأرشيف (أونلاين + على الجهاز) ✓');
  else if(r.localOk) showToast('🗄️ اتحفظ على الجهاز بس' + (isOnlineMode ? ' (تعذر الرفع على Firebase)' : ' (وضع أوفلاين)'));
  else showToast('⚠️ فشل الحفظ في الأرشيف');
  arcRefresh();
}
async function arcBackupCurrent(why){
  return arcSave('backup-'+arcStamp(), why, JSON.parse(JSON.stringify(state)));
}
function arcAfterRestore(msg){
  cacheLocally();
  scheduleAutoSave();
  showToast(msg);
  renderAll();
  arcRefresh();
}
async function restoreMonth(key){
  const data = await arcGetData(key);
  if(!data){ showToast('⚠️ مش لاقي بيانات الشهر ده'); return; }
  const name = arcIndex.find(i=>i.key===key)?.label || key;
  if(!confirm('↩ استرجاع "' + name + '" كامل؟\n\nهيحل محل البيانات الحالية كلها. وهتتحفظ نسخة من الحالي في الأرشيف الأول.')) return;
  await arcBackupCurrent('نسخة تلقائية قبل استرجاع ' + name);
  mergeState(JSON.parse(JSON.stringify(data)));
  arcPreview = null;
  arcAfterRestore('✅ تم استرجاع ' + name);
}
function arcDayRows(data, dayIdx){
  const rows = [];
  for(const sheet of Object.keys(data.supply||{})){
    for(const [label, arr] of Object.entries(data.supply[sheet])){
      const v = Number((arr||[])[dayIdx])||0;
      if(v !== 0) rows.push({name: sheet + ' — ' + label, value: v});
    }
  }
  const a = (data.ayesh||[])[dayIdx];
  if(a){
    const names = {c:'استلامات',d:'مباع',e:'تحويل خارجي',f:'مرتجع',g:'هالك',h:'عيش برون'};
    for(const [f,n] of Object.entries(names)){ const v = Number(a[f])||0; if(v !== 0) rows.push({name:'العيش — '+n, value:v}); }
  }
  return rows;
}
function arcReadDay(key){
  const el = document.getElementById('arcDay-'+key);
  const day = parseInt(el && el.value, 10);
  if(!(day>=1 && day<=31)){ showToast('اكتب رقم يوم من 1 إلى 31'); return null; }
  return day;
}
async function previewDay(key){
  const day = arcReadDay(key); if(!day) return;
  const data = await arcGetData(key);
  if(!data){ showToast('⚠️ مش لاقي بيانات الشهر ده'); return; }
  arcPreview = {key, day, rows: arcDayRows(data, day-1)};
  renderAll();
}
async function restoreDay(key){
  const day = arcReadDay(key); if(!day) return;
  const data = await arcGetData(key);
  if(!data){ showToast('⚠️ مش لاقي بيانات الشهر ده'); return; }
  const rows = arcDayRows(data, day-1);
  const name = arcIndex.find(i=>i.key===key)?.label || key;
  if(!confirm('↩ استرجاع يوم ' + day + ' من "' + name + '"؟\n\nهيستبدل بيانات يوم ' + day + ' الحالية (استلامات، تحويلات، إعدامات، العيش) بالمحفوظة (' + rows.length + ' خانة فيها أرقام). باقي الأيام والمبيعات ما بتتغيرش.')) return;
  await arcBackupCurrent('نسخة تلقائية قبل استرجاع يوم ' + day + ' من ' + name);
  const i = day-1;
  for(const sheet of Object.keys(state.supply)){
    for(const label of Object.keys(state.supply[sheet])){
      const src = data.supply && data.supply[sheet] && data.supply[sheet][label];
      state.supply[sheet][label][i] = src ? (Number(src[i])||0) : 0;
    }
  }
  const a = (data.ayesh||[])[i];
  if(a && state.ayesh[i]) for(const f of ['c','d','e','f','g','h']) state.ayesh[i][f] = Number(a[f])||0;
  arcPreview = null;
  arcAfterRestore('✅ تم استرجاع يوم ' + day);
}
async function deleteArchive(key){
  const name = arcIndex.find(i=>i.key===key)?.label || key;
  if(!confirm('🗑️ حذف "' + name + '" من الأرشيف نهائيًا؟')) return;
  const o = arcLocalLoad(); delete o[key]; arcLocalSave(o);
  if(isOnlineMode){
    try{
      await deleteDoc(doc(db,'kofta-app','archive-'+key));
      const idxRef = doc(db,'kofta-app','archive-index');
      const idxSnap = await getDoc(idxRef);
      if(idxSnap.exists()){
        const items = JSON.parse(idxSnap.data().items).filter(i=>i.key!==key);
        await setDoc(idxRef, {items: JSON.stringify(items)});
      }
    }catch(e){ console.error(e); }
  }
  if(arcPreview && arcPreview.key===key) arcPreview = null;
  showToast('تم الحذف');
  arcRefresh();
}
function renderArchive(){
  const d = new Date();
  const curMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  const fmtDate = t => t ? new Date(t).toLocaleString('ar-EG') : '';
  const list = arcIndex.length ? arcIndex.map(it=>{
    const pv = (arcPreview && arcPreview.key===it.key) ? `<div class="pill" style="margin-top:8px;display:block;">
        <b>يوم ${arcPreview.day}:</b>
        ${arcPreview.rows.length ? '<table style="width:100%;margin-top:6px;"><tbody>' + arcPreview.rows.map(r=>`<tr><td style="text-align:right;">${r.name}</td><td><b>${fmt(r.value)}</b></td></tr>`).join('') + '</tbody></table>' : ' مفيش أرقام مسجلة في اليوم ده'}
      </div>` : '';
    return `<div class="card" style="margin-top:10px;">
      <h2 style="margin-bottom:4px;">🗂️ ${it.label}</h2>
      <p class="small" style="margin:0 0 8px;color:var(--text-light);">اتحفظ: ${fmtDate(it.savedAt)}</p>
      <div class="toolbar">
        <button onclick="restoreMonth('${it.key}')">↩ استرجاع الشهر كامل</button>
        <button class="danger" onclick="deleteArchive('${it.key}')">🗑️ حذف</button>
      </div>
      <div class="toolbar" style="margin-top:8px;align-items:center;">
        <span class="small">يوم:</span>
        <input type="number" min="1" max="31" step="1" id="arcDay-${it.key}" placeholder="1-31" class="tiny">
        <button onclick="previewDay('${it.key}')">👁 معاينة</button>
        <button onclick="restoreDay('${it.key}')">↩ استرجاع اليوم</button>
      </div>${pv}
    </div>`;
  }).join('') : '<p class="small" style="color:var(--text-light);margin-top:12px;">مفيش شهور محفوظة لسه.</p>';
  return `<div class="card">
    <h2>🗄️ الأرشيف</h2>
    <p class="small" style="color:var(--text-light);margin-top:-4px;">احفظ الشهر الحالي بكل أرقامه، وارجعله بعدين شهر كامل أو يوم واحد. لو أونلاين بيتحفظ على Firebase وعلى الجهاز.</p>
    <div class="toolbar" style="margin-top:10px;align-items:center;">
      <input type="month" id="arcMonth" value="${curMonth}" style="padding:9px 8px;border-radius:8px;border:2px solid #B8860B;font-size:15px;">
      <button onclick="archiveCurrentMonth()">📦 حفظ الشهر الحالي في الأرشيف</button>
      <button onclick="arcRefresh()">🔄 تحديث</button>
    </div>
  </div>${list}`;
}


/* ---------- تثبيت التطبيق (PWA) + فحص أسباب عدم ظهور التثبيت ---------- */
let deferredInstall = null;
let installReport = null;
function ensureInstallFab(show){
  let b = document.getElementById('installFab');
  if(!b){
    b = document.createElement('button');
    b.id = 'installFab';
    b.textContent = '📲 تثبيت التطبيق';
    b.style.cssText = 'position:fixed;bottom:16px;left:16px;z-index:900;padding:12px 16px;border-radius:30px;border:2px solid #D4AF37;background:#000;color:#FFD700;font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none;';
    b.onclick = installApp;
    document.body.appendChild(b);
  }
  b.style.display = show ? 'block' : 'none';
}
async function installApp(){
  if(!deferredInstall){ showToast('التثبيت التلقائي مش متاح دلوقتي — شوف الفحص في تبويب صيانة'); return; }
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null;
  ensureInstallFab(false);
  renderAll();
}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; ensureInstallFab(true); });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; ensureInstallFab(false); showToast('✅ اتثبّت التطبيق'); });
async function runInstallCheck(){
  const out = [];
  const ok = (c, good, bad) => out.push({ok:c, text: c ? good : bad});
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  ok(true, standalone ? 'التطبيق شغال مثبّت (standalone) ✓' : 'شغال في المتصفح (مش مثبّت)', '');
  const secure = location.protocol === 'https:' || location.hostname === 'localhost';
  ok(secure, 'الاتصال HTTPS ✓', 'الصفحة مش HTTPS (' + location.protocol + ') — التثبيت مش هيشتغل. افتحها من رابط https://...github.io وليس من ملف على الجهاز');
  let manifest = null;
  try{
    const r = await fetch('./manifest.json', {cache:'no-store'});
    if(r.ok){ manifest = await r.json(); }
    ok(!!manifest, 'manifest.json موجود ✓', 'manifest.json مش موجود جنب index.html (status ' + r.status + ') — لازم ترفعه على GitHub في نفس المجلد');
  }catch(e){ ok(false, '', 'تعذر تحميل manifest.json — ارفعه على GitHub في نفس المجلد'); }
  if(manifest){
    for(const ic of (manifest.icons||[])){
      try{ const r = await fetch(ic.src.startsWith('.')||ic.src.startsWith('/')?ic.src:'./'+ic.src, {cache:'no-store'}); ok(r.ok, 'أيقونة ' + ic.sizes + ' ✓', 'أيقونة ' + ic.sizes + ' مش موجودة (' + ic.src + ') — ارفعها'); }
      catch(e){ ok(false, '', 'أيقونة ' + ic.src + ' مش موجودة — ارفعها'); }
    }
  }
  try{
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    ok(!!reg, 'service worker متسجّل ✓', 'service worker مش متسجّل — تأكد إن service-worker.js مرفوع جنب index.html ثم حدّث الصفحة مرتين');
  }catch(e){ ok(false, '', 'service worker مش مدعوم/متسجّل'); }
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIos) out.push({ok:true, text:'آيفون: الخيار من سفاري فقط — زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"'});
  else ok(!!deferredInstall, 'المتصفح جاهز للتثبيت ✓ (زر 📲 ظاهر)', standalone ? 'مثبّت بالفعل' : 'المتصفح لسه ما أعطاش إذن التثبيت — افتح قائمة كروم ⋮ ثم "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"، ولو مش موجودة افتح الصفحة مرتين من نفس الرابط');
  installReport = out;
  renderAll();
}
function renderInstallCard(){
  const rows = installReport ? installReport.map(r=>`<div class="pill" style="display:block;margin-top:6px;background:${r.ok?'#DCFCE7':'#FEE2E2'};color:#111;">${r.ok?'✅':'❌'} ${r.text}</div>`).join('') : '';
  return `<div class="card">
    <h2>📲 تثبيت التطبيق على الموبايل</h2>
    <div class="toolbar" style="margin-top:6px;">
      <button onclick="installApp()">📲 تثبيت</button>
      <button onclick="runInstallCheck()">🔍 فحص التثبيت</button>
    </div>${rows}
  </div>`;
}

/* ---------- صيانة ---------- */
function renderSiyana(){
  let body = state.siyana.map((s,idx)=>`
    <tr>
      <td><input type="text" value="${s.date}" onchange="updateSiyana(${idx},'date',this.value)"></td>
      <td><input type="text" class="wide" value="${s.desc}" onchange="updateSiyana(${idx},'desc',this.value)"></td>

    </tr>`).join('');
  const total = state.siyana.reduce((s,x)=>s+(Number(x.amount)||0),0);
  return renderInstallCard() + `
  <div class="card">
    <h2>🔧 صيانة</h2>
    <div class="toolbar"><button onclick="addSiyana()">➕ إضافة عملية</button><button onclick="saveState()">☁️ حفظ في Firebase</button></div>
    <div class="pill">عدد العمليات: <b>${state.siyana.length}</b></div>
    <div class="pill">إجمالي التكلفة: <b>${fmt(total)}</b></div>
    <div class="tablewrap" style="margin-top:10px;"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>—</th></tr></thead><tbody>${body}</tbody></table></div>
  </div>`;
}
function updateSiyana(idx, field, value){ state.siyana[idx][field] = field==='amount'?(parseFloat(value)||0):value; renderAll(); }
function addSiyana(){ state.siyana.push({date:'',desc:'',amount:0}); renderAll(); }
function deleteSiyana(idx){ state.siyana.splice(idx,1); renderAll(); }

/* ============================================================
   رفع البيانات المحلية على Firebase (مزامنة)
   ============================================================ */
async function syncLocalToFirebase(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    showToast('⚠️ مفيش بيانات محلية لرفعها');
    return;
  }
  showToast('☁️ جاري رفع البيانات المحلية...');
  try{
    await setDoc(STATE_DOC, { data: raw, updatedAt: Date.now() });
    showToast('✓ تم رفع البيانات على Firebase بنجاح');
    document.getElementById('status').textContent = 'تم رفع البيانات: ' + new Date().toLocaleTimeString('ar-EG');
  }catch(e){
    console.error(e);
    showToast('⚠️ فشل الرفع: ' + e.message);
  }
}

/* ============================================================
   تصدير / استيراد JSON (نسخة احتياطية كاملة)
   ============================================================ */
function exportJSON(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kofta-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ تم تصدير النسخة الاحتياطية');
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const loaded = JSON.parse(e.target.result);
      mergeState(loaded);
      cacheLocally();
      renderAll();
      showToast('✓ تم استيراد النسخة الاحتياطية');
    }catch(err){ showToast('⚠️ ملف JSON غير صالح: '+err.message); }
  };
  reader.readAsText(file);
}

/* ============================================================
   استرجاع من Firebase
   ============================================================ */
async function restoreFromFirebase(){
  if(!isOnlineMode){
    showToast('⚠️ حول للأونلاين الأول');
    return;
  }
  showToast('☁️ جاري استرجاع آخر نسخة من Firebase...');
  try{
    const snap = await getDoc(STATE_DOC);
    if(snap.exists()){
      const loaded = JSON.parse(snap.data().data);
      mergeState(loaded);
      cacheLocally();
      renderAll();
      showToast('✓ تم استرجاع آخر نسخة من Firebase ☁️');
      document.getElementById('status').textContent = 'تم استرجاع آخر نسخة من Firebase: ' + new Date().toLocaleTimeString('ar-EG');
    } else {
      showToast('⚠️ مفيش نسخة محفوظة على Firebase');
    }
  }catch(e){
    console.error(e);
    showToast('⚠️ فشل الاسترجاع: ' + e.message);
  }
}

function renderAll(){

  else if(activeTab==='المبيعات') html = renderMabee3at();
  else if(activeTab==='معادلة_التحليل') html = renderTahleel();

  else if(activeTab==='الاستهلاك') html = renderCons();
  else if(activeTab==='الأرشيف') html = renderArchive();
  else if(activeTab==='صيانة') html = renderSiyana();

  main.classList.remove('view-enter');
  void main.offsetWidth; // إعادة تشغيل الأنيميشن
  main.classList.add('view-enter');

  const pickBtn = document.getElementById('pickBtnMain');
  const dropMain = document.getElementById('dropMain');
  const fileInput = document.getElementById('fileInput');
  if(pickBtn) pickBtn.onclick = ()=> fileInput.click();
  if(dropMain){
    dropMain.onclick = ()=> fileInput.click();
    dropMain.ondragover = e=>{ e.preventDefault(); };
    dropMain.ondrop = e=>{ e.preventDefault(); if(e.dataTransfer.files.length) handleHtmFile(e.dataTransfer.files[0]); };
  }
  scheduleAlertCheck();
}

function applyTheme() {
  document.body.classList.toggle('dark-mode', isDarkMode);

  if (themeBtn) themeBtn.innerHTML = isDarkMode ? '☀️ نهاري' : '🌙 ليلي';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isDarkMode ? '#0B0F19' : '#4F46E5');
}
function toggleTheme() {
  isDarkMode = !isDarkMode;
  try { localStorage.setItem('kofta-dark-mode', String(isDarkMode)); } catch (e) {}
  applyTheme();
}

/* ============================================================
   تحسينات السلاسة والانسيابية وسرعة الإدخال والتنقل الذكي
   ============================================================ */
document.addEventListener('focusin', function(e) {
  if (e.target && (e.target.tagName === 'INPUT' && (e.target.type === 'number' || e.target.type === 'text') && !e.target.classList.contains('search-input'))) {
    // تحديد النص بالكامل تلقائيًا لسرعة الكتابة دون الحاجة للمسح اليدوي
    setTimeout(() => { try { e.target.select(); } catch(err){} }, 30);
  }
});

document.addEventListener('keydown', function(e) {
  const target = e.target;
  if (!target || target.tagName !== 'INPUT') return;
  
  if (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const table = target.closest('table');
    if (!table) return;
    
    const inputs = Array.from(table.querySelectorAll('input:not([type=file]):not([type=checkbox])'));
    const index = inputs.indexOf(target);
    if (index === -1) return;
    
    const currentTd = target.closest('td');
    const currentTr = target.closest('tr');
    if (!currentTd || !currentTr) return;
    
    const colIndex = Array.from(currentTr.children).indexOf(currentTd);
    const tbody = table.querySelector('tbody') || table;
    const allTrs = Array.from(tbody.querySelectorAll('tr'));
    const rowIndex = allTrs.indexOf(currentTr);
    
    let nextInput = null;
    
    if (e.key === 'Enter' || e.key === 'ArrowDown') {
      // الانتقال للسطر التالي في نفس العمود أو الخانة التالية
      if (rowIndex !== -1 && rowIndex < allTrs.length - 1) {
        const nextTr = allTrs[rowIndex + 1];
        const sameColTd = nextTr.children[colIndex];
        if (sameColTd) {
          nextInput = sameColTd.querySelector('input');
        }
      }
      if (!nextInput && index < inputs.length - 1) {
        nextInput = inputs[index + 1];
      }
      if (nextInput) {
        e.preventDefault();
        nextInput.focus();
      }
    } else if (e.key === 'ArrowUp') {
      if (rowIndex > 0) {
        const prevTr = allTrs[rowIndex - 1];
        const sameColTd = prevTr.children[colIndex];
        if (sameColTd) {
          nextInput = sameColTd.querySelector('input');
        }
      }
      if (!nextInput && index > 0) {
        nextInput = inputs[index - 1];
      }
      if (nextInput) {
        e.preventDefault();
        nextInput.focus();
      }
    } else if (e.key === 'ArrowLeft') { // في الوضع RTL: سهم يسار يذهب للعمود التالي
      if (index < inputs.length - 1 && target.selectionEnd === target.value.length) {
        nextInput = inputs[index + 1];
        if (nextInput) { nextInput.focus(); }
      }
    } else if (e.key === 'ArrowRight') { // في الوضع RTL: سهم يمين يذهب للعمود السابق
      if (index > 0 && target.selectionStart === 0) {
        nextInput = inputs[index - 1];
        if (nextInput) { nextInput.focus(); }
      }
    }
  }
});
