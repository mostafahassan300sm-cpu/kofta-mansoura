<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>معادلة كوفتا — كوفتا المنصورة</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#6366F1; --primary-dark:#4F46E5; --primary-light:#E0E7FF;
    --success:#10B981; --success-dark:#059669; --success-light:#D1FAE5;
    --danger:#F43F5E; --danger-dark:#E11D48; --danger-light:#FFE4E6;
    --warning:#F59E0B; --warning-dark:#D97706; --warning-light:#FEF3C7;
    --info:#06B6D4; --info-dark:#0891B2; --info-light:#CFFAFE;
    --violet:#8B5CF6; --violet-dark:#7C3AED; --violet-light:#EDE9FE;
    --rose:#FB7185; --rose-dark:#E11D48;
    --text:#111827; --text-light:#6B7280; --text-muted:#9CA3AF;
    --bg:#F8FAFC; --card:#FFFFFF; --border:#E2E8F0; --border-light:#F1F5F9;
    --shadow:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -2px rgba(0,0,0,0.04);
    --shadow-sm:0 4px 6px -1px rgba(0,0,0,0.06),0 2px 4px -1px rgba(0,0,0,0.03);
    --radius:16px; --radius-sm:10px; --radius-xs:6px;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,#F8FAFC 0%,#EEF2FF 50%,#F0FDFA 100%);color:var(--text);font-family:"Segoe UI","Tahoma",system-ui,-apple-system,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom));font-size:14.5px;line-height:1.6;}

  /* Header - Vibrant Indigo */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#2563EB 100%);box-shadow:0 8px 32px rgba(79,70,229,0.35);padding:10px 14px 10px;color:#fff;}
  h1{display:none;}
  .status{display:none;}
  .header-actions{display:flex;justify-content:center;gap:8px;margin-bottom:0;flex-wrap:wrap;}
  .online-toggle{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.18);backdrop-filter:blur(12px);
    border:1.5px solid rgba(255,255,255,0.35);border-radius:28px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;transition:all 0.25s;
  }
  .online-toggle:hover{background:rgba(255,255,255,0.3);transform:translateY(-1px);}
  .online-toggle.on{background:linear-gradient(135deg,var(--success),var(--success-dark));border-color:transparent;box-shadow:0 4px 12px rgba(16,185,129,0.4);}
  .online-toggle.off{background:linear-gradient(135deg,var(--danger),var(--danger-dark));border-color:transparent;box-shadow:0 4px 12px rgba(244,63,94,0.4);}
  .save-all-btn{
    background:#fff;color:var(--primary-dark);border:none;border-radius:28px;padding:9px 20px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.12);transition:all 0.25s;
  }
  .save-all-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.18);filter:brightness(1.05);}
  .save-all-btn:active{transform:translateY(0);}

  /* Bottom Navigation - Native App Style */
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;overflow-x:auto;gap:2px;
    background:rgba(255,255,255,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--border);box-shadow:0 -8px 28px rgba(31,41,55,0.12);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-width:64px;padding:7px 10px;border-radius:14px;background:transparent;color:var(--text-muted);
    font-size:10.5px;font-weight:700;cursor:pointer;border:none;white-space:nowrap;transition:all 0.2s;}
  .tab .tab-icon{font-size:19px;line-height:1;transition:transform 0.2s;}
  .tab:active .tab-icon{transform:scale(0.85);}
  .tab:hover{background:var(--primary-light);color:var(--primary-dark);}
  .tab.active{background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(99,102,241,0.4);}
  .tab.active .tab-icon{transform:scale(1.1);}

  /* Page transition */
  @keyframes viewIn{from{opacity:0;transform:translateX(-18px) scale(.98);}to{opacity:1;transform:translateX(0) scale(1);}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  #main.view-enter{animation:viewIn 0.35s cubic-bezier(.22,.61,.36,1) both;}

  main{max-width:1450px;margin:0 auto;padding:24px 14px;}

  /* Cards - Glassmorphism */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:all 0.3s;animation:slideUp 0.4s ease-out;}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .card h2{margin:0 0 16px;font-size:20px;color:var(--primary-dark);font-weight:800;border-right:5px solid var(--primary);padding-right:14px;letter-spacing:-0.3px;}

  /* Alert Box */
  .alert{padding:14px 18px;border-radius:var(--radius-sm);margin-bottom:16px;border-right:4px solid;font-weight:600;animation:slideUp 0.3s ease-out;}
  .alert.warning{background:#FEF3C7;border-color:var(--warning);color:#7C2D12;}
  .alert.danger{background:#FFE4E6;border-color:var(--danger);color:#881337;}
  .alert.success{background:var(--success-light);border-color:var(--success);color:#064E3B;}
  .alert.info{background:var(--info-light);border-color:var(--info);color:#164E63;}

  /* Charts Container */
  .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px;}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);transition:all 0.3s;}
  .chart-card:hover{box-shadow:var(--shadow);}
  .chart-card h3{margin:0 0 16px;font-size:16px;color:var(--primary-dark);font-weight:700;}
  .chart-container{position:relative;height:300px;}

  /* Tables - Modern */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;}
  th,td{padding:12px 10px;text-align:center;border-bottom:1.5px solid var(--border-light);white-space:nowrap;}
  th{background:linear-gradient(180deg,#F8FAFC,#EEF2FF);color:var(--text);font-size:12px;font-weight:800;position:sticky;top:0;z-index:2;border-bottom:3px solid var(--primary);text-transform:uppercase;letter-spacing:0.8px;padding:14px 10px;}
  td.name{text-align:right;padding-right:14px;color:#111827;font-weight:800;position:sticky;right:0;background:var(--card);z-index:1;min-width:130px;font-size:14.5px;}
  tr:nth-child(even) td{background:#FAFBFF;}
  tr:nth-child(even) td.name{background:#FAFBFF;}
  tr:hover td{background:linear-gradient(90deg,var(--primary-light),#F0FDFA);transition:all 0.15s;}
  tr:hover td.name{background:linear-gradient(90deg,var(--primary-light),#F0FDFA);}
  .tablewrap{overflow:auto;max-height:65vh;border:1.5px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 2px 8px rgba(0,0,0,0.04);}

  /* Inputs - Modern */
  input[type=number],input[type=text]{width:64px;background:#fff;color:#111827;border:2px solid var(--border-light);
    border-radius:var(--radius-xs);padding:8px 6px;text-align:center;font-size:13.5px;font-weight:700;transition:all 0.2s;}
  input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light);background:#FAFBFF;}
  input.wide{width:170px;text-align:right;padding-right:10px;}
  input.tiny{width:54px;}

  /* Buttons - Vibrant */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  button{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:var(--radius-xs);
    padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(99,102,241,0.35);transition:all 0.25s;}
  button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.45);filter:brightness(1.08);}
  button:active{transform:translateY(0) scale(0.96);}
  button.secondary{background:#fff;border:2px solid var(--border);color:var(--text);box-shadow:var(--shadow-sm);}
  button.secondary:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light);box-shadow:0 4px 12px rgba(99,102,241,0.15);}
  button.danger{background:linear-gradient(135deg,var(--danger),var(--danger-dark));color:#fff;padding:7px 14px;font-size:12.5px;border-radius:var(--radius-xs);box-shadow:0 4px 12px rgba(244,63,94,0.3);}
  button.danger:hover{box-shadow:0 6px 16px rgba(244,63,94,0.4);}

  /* Pills - Vibrant */
  .pill{background:linear-gradient(135deg,var(--primary-light),#E0E7FF);border:1.5px solid #C7D2FE;border-radius:24px;padding:8px 16px;font-size:13.5px;color:var(--primary-dark);display:inline-block;margin:4px;font-weight:700;box-shadow:0 2px 6px rgba(99,102,241,0.1);}
  .pill b{color:var(--primary-dark);font-weight:800;}

  /* Status Colors - Graphic & Vibrant with Dark Text for Readability */
  .cell-red{background:linear-gradient(135deg,#FECDD3,#FDA4AF);color:#881337;font-weight:800;border-radius:10px;padding:6px 10px;box-shadow:0 2px 6px rgba(244,63,94,0.2);font-size:13.5px;}
  .cell-orange{background:linear-gradient(135deg,#FED7AA,#FDBA74);color:#7C2D12;font-weight:800;border-radius:10px;padding:6px 10px;box-shadow:0 2px 6px rgba(245,158,11,0.2);font-size:13.5px;}
  .cell-green{background:linear-gradient(135deg,#A7F3D0,#6EE7B7);color:#064E3B;font-weight:800;border-radius:10px;padding:6px 10px;box-shadow:0 2px 6px rgba(16,185,129,0.2);font-size:13.5px;}
  .cell-violet{background:linear-gradient(135deg,#DDD6FE,#C4B5FD);color:#5B21B6;font-weight:800;border-radius:10px;padding:6px 10px;box-shadow:0 2px 6px rgba(139,92,246,0.2);font-size:13.5px;}
  .cell-cyan{background:linear-gradient(135deg,#A5F3FC,#67E8F9);color:#164E63;font-weight:800;border-radius:10px;padding:6px 10px;box-shadow:0 2px 6px rgba(6,182,212,0.2);font-size:13.5px;}
  .ag-col{background:linear-gradient(135deg,#BAE6FD,#7DD3FC);color:#0C4A6E;font-weight:800;border-radius:10px;padding:6px 10px;box-shadow:0 2px 6px rgba(59,130,246,0.2);font-size:13.5px;}

  /* Toast - Vibrant */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(24px);background:linear-gradient(135deg,var(--success),var(--success-dark));color:#fff;
    padding:14px 32px;border-radius:32px;font-weight:800;font-size:16px;opacity:0;pointer-events:none;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);z-index:60;box-shadow:0 12px 32px rgba(16,185,129,0.4);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Notes */
  .note{font-size:13px;color:var(--text-light);margin-top:12px;line-height:1.8;background:linear-gradient(135deg,var(--primary-light),#F0FDFA);padding:14px 18px;border-radius:var(--radius-sm);border-right:4px solid var(--primary);font-weight:500;}

  /* Grid */
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;}

  /* Pick Button */
  .pick-btn{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;
    background:linear-gradient(135deg,var(--primary),var(--violet));color:#fff;border:none;border-radius:var(--radius);
    padding:28px 18px;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(99,102,241,0.35);transition:all 0.3s;}
  .pick-btn:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(99,102,241,0.45);filter:brightness(1.08);}
  .pick-btn:active{transform:translateY(-1px);}
  .pick-btn-title{font-size:20px;font-weight:900;}
  .pick-btn-sub{font-size:13px;font-weight:600;opacity:.9;}

  input[type=file]{display:none;}
  .drop{border:2.5px dashed var(--primary);border-radius:var(--radius-sm);padding:18px;text-align:center;margin-top:14px;font-size:14px;color:var(--primary);cursor:pointer;background:linear-gradient(135deg,var(--primary-light),#F0FDFA);transition:all 0.25s;font-weight:600;}
  .drop:hover{background:#DBEAFE;border-style:solid;transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,0.15);}

  /* Scrollbar - Graphic */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);border-radius:5px;}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--primary),var(--violet));border-radius:5px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--primary-dark),var(--violet-dark));}

  /* Login Gate */
  .login-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4F46E5 0%,#7C3AED 50%,#2563EB 100%);padding:20px;}
  .login-box{background:#fff;border-radius:var(--radius);padding:36px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .login-box .emoji{font-size:40px;margin-bottom:6px;}
  .login-box h2{margin:0 0 6px;font-size:19px;font-weight:900;color:var(--primary-dark);}
  .login-box p{margin:0 0 18px;font-size:13px;color:var(--text-light);}
  .login-box input[type=password]{width:100%;font-size:16px;padding:12px 14px;border-radius:var(--radius-sm);border:2px solid var(--border-light);text-align:center;font-weight:700;letter-spacing:2px;}
  .login-box input[type=password]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light);}
  .login-box button{width:100%;margin-top:14px;padding:12px;font-size:14.5px;}
  .login-box .login-error{color:var(--danger-dark);font-size:12.5px;font-weight:700;margin-top:10px;min-height:16px;}

  /* Dashboard Stats */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:linear-gradient(135deg,var(--primary-light),#E0E7FF);border:1px solid #C7D2FE;border-radius:var(--radius-sm);padding:16px;text-align:center;box-shadow:var(--shadow-sm);}
  .stat-card.warning{background:linear-gradient(135deg,var(--warning-light),#FEF3C7);border-color:#FCD34D;}
  .stat-card.danger{background:linear-gradient(135deg,var(--danger-light),#FFE4E6);border-color:#FBCFE8;}
  .stat-card.success{background:linear-gradient(135deg,var(--success-light),#D1FAE5);border-color:#A7F3D0;}
  .stat-label{font-size:12px;color:var(--text-light);font-weight:600;margin-bottom:6px;}
  .stat-value{font-size:24px;font-weight:900;color:var(--primary-dark);}
  .stat-card.warning .stat-value{color:#7C2D12;}
  .stat-card.danger .stat-value{color:#881337;}
  .stat-card.success .stat-value{color:#064E3B;}

  /* Timeline */
  .timeline{position:relative;padding:20px 0;}
  .timeline-item{display:flex;gap:16px;margin-bottom:20px;position:relative;}
  .timeline-marker{width:12px;height:12px;background:var(--primary);border-radius:50%;margin-top:4px;flex-shrink:0;box-shadow:0 0 0 4px var(--primary-light);}
  .timeline-content{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;flex:1;}
  .timeline-content .time{font-size:12px;color:var(--text-light);font-weight:600;}
  .timeline-content .desc{font-size:13.5px;color:var(--text);margin-top:4px;}

  /* Responsive */
  @media (max-width:768px){
    .header-actions{gap:8px;}
    .save-all-btn{padding:7px 14px;font-size:12px;}
    .card{padding:16px;}
    th,td{padding:10px 6px;font-size:12.5px;}
    input[type=number],input[type=text]{width:54px;padding:5px 3px;}
    .charts-grid{grid-template-columns:1fr;}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="emoji">🔒</div>
    <h2>معادلة كوفتا</h2>
    <p>كوفتا المنصورة SAB 4 — أدخل كلمة المرور للدخول</p>
    <input type="password" id="loginPass" placeholder="كلمة المرور" autocomplete="off">
    <button onclick="tryLogin()">دخول</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<header>
  <h1>🍖 معادلة كوفتا — كوفتا المنصورة SAB 4</h1>
  <div class="status" id="status">جاري التحميل...</div>
  <div class="header-actions" id="headerActions"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".htm,.html">

}

function mergeState(loaded){
  const def = defaultState();
  function deepMerge(target, source){
    if(source === null || source === undefined) return target;
    if(typeof source !== 'object') return target;
    if(Array.isArray(source)) return source.slice();
    const result = {};
    const keys = new Set([...Object.keys(target || {}), ...Object.keys(source || {})]);
    for(const key of keys){
      if(source.hasOwnProperty(key)){
        if(typeof source[key] === 'object' && source[key] !== null && !Array.isArray(source[key]) &&
           typeof target[key] === 'object' && target[key] !== null && !Array.isArray(target[key])){
          result[key] = deepMerge(target[key], source[key]);
        } else {
          result[key] = source[key];
        }
      } else {
        result[key] = target[key];
      }
    }
    return result;
  }
  state = deepMerge(def, loaded);
}

async function loadState(){
  if(isOnlineMode){
    try{
      const snap = await getDoc(STATE_DOC);
      if(snap.exists()){
        const loaded = JSON.parse(snap.data().data);
        mergeState(loaded);
        cacheLocally();
        document.getElementById('status').textContent = 'تم تحميل آخر نسخة من Firebase ☁️';
        return;
      }
    }catch(e){
      console.error(e);
      document.getElementById('status').textContent = '⚠️ تعذر الاتصال بـ Firebase - جاري التحميل من النسخة المحلية';
    }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      mergeState(JSON.parse(raw));
      document.getElementById('status').textContent = 'تم تحميل النسخة المحلية المخزنة';
    }
  }catch(e){
    console.error(e);
    document.getElementById('status').textContent = '⚠️ تعذر تحميل البيانات';
  }
}

function computeMaterials(){
  const materials = {};
  for(const [code,r] of Object.entries(RECIPES)){
    const item = state.raw.find(x=>x.code===code);
    const qty = item ? Number(item.qty)||0 : 0;
    for(const [material,factor] of Object.entries(r.factors)){
      if(!materials[material]) materials[material] = 0;
      materials[material] += qty * factor;
    }
  }
  return materials;
}

function computeAnalysis(){
  const rows = [];
  for(const name of state.coreItems){
    const std = SHEET_STANDARD_ITEMS.has(name);
    const b = state.analysis[name]?.b || 0;
    const c = std ? (SHEET_DEFS['الاستلامات'].find(d=>d.core===name)?.label ? state.supply['الاستلامات'][SHEET_DEFS['الاستلامات'].find(d=>d.core===name).label].reduce((s,v)=>s+(v||0),0) : 0) : (state.customFields[name]?.c || 0);
    const d = std ? (SHEET_DEFS['محول له'].find(d=>d.core===name)?.label ? state.supply['محول له'][SHEET_DEFS['محول له'].find(d=>d.core===name).label].reduce((s,v)=>s+(v||0),0) : 0) : (state.customFields[name]?.d || 0);
    const e = computeE(name);
    const f = std ? (SHEET_DEFS['محول منه'].find(d=>d.core===name)?.label ? state.supply['محول منه'][SHEET_DEFS['محول منه'].find(d=>d.core===name).label].reduce((s,v)=>s+(v||0),0) : 0) : (state.customFields[name]?.f || 0);
    const g = std ? (SHEET_DEFS['اعدامات'].find(d=>d.core===name)?.label ? state.supply['اعدامات'][SHEET_DEFS['اعدامات'].find(d=>d.core===name).label].reduce((s,v)=>s+(v||0),0) : 0) : (state.customFields[name]?.g || 0);
    const h = name === 'رايب' ? computeRayebInventoryTotal() : (state.analysis[name]?.h || 0);
    const i = b + c + d - e - f - g - h;
    const j = e > 0 ? Math.abs(i) / e : 0;
    const k = g > 0 ? g / (e + g) : 0;
    const l = j + k;
    const aa = e * (1 - j - k);
    const ab = aa - (state.customFields[name]?.consumption || 0);
    
    rows.push({name, b, c, d, e, f, g, h, i, j, k, l, aa, ab, isStandard: std, linkedByCode: false});
  }
  return rows;
}

function computeE(name){
  const material = MATERIAL_MAP[name];
  if(!material) return 0;
  return state.raw.reduce((s,r)=>{
    const recipe = RECIPES[r.code];
    if(recipe && recipe.factors[material]) return s + (r.qty||0) * recipe.factors[material];
    return s;
  }, 0);
}

function computeRayebInventoryTotal(){
  return (state.rayebInv.rayebKham || 0) * 0.95 + (state.rayebInv.rayebMasnoo || 0) * 0.18 + (state.rayebInv.serbToot || 0) * 4.45 + (state.rayebInv.serbKiwi || 0) * 4.2;
}

function computeWagabatIstaf(){
  const kofta = state.raw.find(r=>r.code==='5429')?.qty || 0;
  const hawawshi = state.raw.find(r=>r.code==='5430')?.qty || 0;
  const total = kofta + hawawshi;
  const meals = total / 4;
  return {kofta, hawawshi, total, meals};
}

function colorClassForDiff(val){
  if(val === 0) return 'cell-green';
  if(Math.abs(val) < 10) return 'cell-green';
  if(Math.abs(val) < 50) return 'cell-orange';
  return 'cell-red';
}

function colorClassForPct(val){
  if(val < 0.05) return 'cell-green';
  if(val < 0.1) return 'cell-orange';
  return 'cell-red';
}

function colorClassForTotalPct(val){
  if(val < 0.1) return 'cell-green';
  if(val < 0.2) return 'cell-orange';
  return 'cell-red';
}

function diffLabel(val){
  if(val === 0) return 'متطابق';
  if(val > 0) return 'زيادة';
  return 'نقص';
}

function pasteRaw(){
  navigator.clipboard.readText().then(text=>{
    const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
    let added=0;
    for(const line of lines){
      const parts = line.split('\t');
      if(parts.length>=3){
        const code=parts[0].trim(), name=parts[1].trim(), qty=parseFloat(parts[2].replace(/,/g,''));
        if(code && !isNaN(qty)){
          const ex = state.raw.find(r=>r.code===code);
          if(ex){ ex.qty=qty; } else state.raw.push({code,name,qty});
          added++;
        }
      }
    }
    addToChangelog(`لصق ${added} صف من الحافظة`);
    showToast(`تم استيراد ${added} صف`);
    renderAll();
  }).catch(()=>showToast('⚠️ اسمح للمتصفح بالوصول للحافظة'));
}

        <div class="stat-value">${fmt(totalSales)}</div>
      </div>
      <div class="stat-card success">
        <div class="stat-label">الأصناف الأساسية</div>
        <div class="stat-value">${state.coreItems.length}</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-label">عمليات الصيانة</div>
        <div class="stat-value">${state.siyana.length}</div>
      </div>
    </div>
  </div>`;

  html += `<div class="card">
    <h2>🎯 توزيع الأصناف الأساسية</h2>
    <div class="grid2">`;
  for(const [material, qty] of Object.entries(materials)){
    html += `<div class="pill">${material}: <b>${fmt(qty)}</b></div>`;
  }
  html += `</div></div>`;

  html += `<div class="card">
    <h2>📈 ملخص التحليل</h2>
    <div class="tablewrap"><table><thead><tr><th>الصنف</th><th>المباع</th><th>الفرق</th><th>نسبة الفقد</th><th>الحالة</th></tr></thead><tbody>`;
  for(const r of analysisRows){
    html += `<tr>
      <td class="name">${r.name}</td>
      <td>${fmt(r.e)}</td>
      <td class="${colorClassForDiff(r.i)}">${fmt(r.i)}</td>
      <td>${(r.j*100).toFixed(1)}%</td>
      <td class="${Math.abs(r.ab)>10?'cell-violet':(Math.abs(r.ab)>2?'cell-orange':'cell-green')}">${Math.abs(r.ab)>10?'⚠️ تحذير':(Math.abs(r.ab)>2?'⚡ تنبيه':'✅ طبيعي')}</td>
    </tr>`;
  }
  html += `</tbody></table></div></div>`;

  return html;
}

function addToChangelog(action){
  if(!state.changelog) state.changelog = [];
  state.changelog.push({
    timestamp: new Date().toLocaleString('ar-EG'),
    action: action
  });
  if(state.changelog.length > 100) state.changelog.shift();
}

function renderHistory(){
  if(!state.changelog) state.changelog = [];
  const items = state.changelog.slice().reverse();
  
  let html = `<div class="card">
    <h2>⏱️ سجل التغييرات</h2>
    <div class="timeline">`;
  
  for(const item of items){
    html += `<div class="timeline-item">
      <div class="timeline-marker"></div>
      <div class="timeline-content">
        <div class="time">${item.timestamp}</div>
        <div class="desc">${item.action}</div>
      </div>
    </div>`;
  }
  
  html += `</div></div>`;
  return html;
}

function saveAllData(){
  saveState();
  showToast('✅ تم حفظ جميع البيانات');
}

function tryLogin(){
  const pass = document.getElementById('loginPass').value;
  if(pass === 'kofta2024'){
    localStorage.setItem('kofta-logged', 'true');
    document.getElementById('loginOverlay').style.display = 'none';
    init();
  } else {
    document.getElementById('loginError').textContent = '❌ كلمة المرور غير صحيحة';
    document.getElementById('loginPass').value = '';
  }
}

async function init(){
  await loadState();
  renderHeaderActions();
  renderAll();
  setupFileHandlers();
  document.addEventListener('keydown', e=>{
    if(e.ctrlKey && e.key==='s'){ e.preventDefault(); saveAllData(); }
  });
}

function setupFileHandlers(){
  const fileInput = document.getElementById('fileInput');
  const pickBtn = document.getElementById('pickBtnMain');
  const dropZone = document.getElementById('dropMain');
  
  if(pickBtn) pickBtn.onclick = ()=>fileInput.click();
  if(fileInput) fileInput.onchange = (e)=>handleFileSelect(e.target.files[0]);
  if(dropZone){
    dropZone.ondragover = (e)=>{ e.preventDefault(); dropZone.style.opacity='0.7'; };
    dropZone.ondragleave = ()=>{ dropZone.style.opacity='1'; };
    dropZone.ondrop = (e)=>{ e.preventDefault(); dropZone.style.opacity='1'; handleFileSelect(e.dataTransfer.files[0]); };
  }
}

function handleFileSelect(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const html = e.target.result;
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const rows = doc.querySelectorAll('tr');
      let added = 0;
      for(const row of rows){
        const cells = row.querySelectorAll('td');
        if(cells.length >= 3){
          const code = cells[0]?.textContent?.trim();
          const name = cells[1]?.textContent?.trim();
          const qty = parseFloat(cells[2]?.textContent?.replace(/,/g,''));
          if(code && name && !isNaN(qty)){
            const ex = state.raw.find(r=>r.code===code);
            if(ex){ ex.qty = qty; } else state.raw.push({code, name, qty});
            added++;
          }
        }
      }
      addToChangelog(`استيراد ${added} صنف من ملف`);
      showToast(`✅ تم استيراد ${added} صنف`);
      renderAll();
    }catch(err){
      showToast('❌ خطأ في قراءة الملف');
      console.error(err);
    }
  };
  reader.readAsText(file);
}
